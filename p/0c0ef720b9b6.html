<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Accès réservé</title>
<!--
  Page protégée par mot de passe (playlist exportée du rapport, mise en ligne).
  Le contenu (#coffre) est chiffré : AES-GCM 256 bits, clé tirée du mot de
  passe par PBKDF2-SHA-256 (« it » itérations, sel aléatoire). Sans le mot de
  passe, rien n'est lisible : ni images, ni notes, ni liens des vidéos.
  Le bon mot de passe déchiffre la page dans le navigateur, qui l'affiche à la
  place de celle-ci. Rien n'est envoyé nulle part.
-->
<style>
  html,body{margin:0;height:100%;background:#05070d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
  .carte{width:100%;max-width:380px;background:#0d1a33;border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:26px 22px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  h1{margin:0 0 6px;font-size:22px}
  p{margin:0 0 16px;font-size:14px;opacity:.8;line-height:1.4}
  input[type=password]{width:100%;box-sizing:border-box;font-size:17px;padding:12px;border-radius:9px;border:none;margin-bottom:12px}
  label{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:16px;opacity:.9}
  button{width:100%;font-size:17px;font-weight:800;padding:12px;border:none;border-radius:9px;background:#ffd400;color:#0a1a40;cursor:pointer}
  button:disabled{opacity:.6}
  .err{color:#ff8a8a;font-weight:700;min-height:20px;margin:12px 0 0}
</style>
</head>
<body>
<form class="carte" id="f" autocomplete="on">
  <h1>🔒 Accès réservé</h1>
  <p>Entrez le mot de passe transmis par le staff.</p>
  <input type="text" name="username" value="playlist" autocomplete="username" hidden>
  <input type="password" id="mdp" autocomplete="current-password" placeholder="Mot de passe" autofocus>
  <label><input type="checkbox" id="garder" checked> Se souvenir sur cet appareil</label>
  <button type="submit" id="ok">Ouvrir</button>
  <p class="err" id="err"></p>
</form>
<script type="application/json" id="coffre">{"v":1,"it":600000,"sel":"zaHI0\/rsb+SxfcwYZ6523A==","iv":"J3hJFooimmLEp8lN","c":"IYx1PNEUxijajQ17RgNbzB38f7itK\/hnhL3o3xYj"}</script>
<script>
(function () {
  var C = JSON.parse(document.getElementById("coffre").textContent);
  // Un seul mot de passe pour toutes les pages du staff (rapport, playlists) :
  // retenu pour tout le site, il ouvre aussi les suivantes sans le redemander.
  var CLE = "co_coffre", ANCIENNE = "co_coffre|" + location.pathname;
  function octets(b64) {
    var s = atob(b64), u = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) { u[i] = s.charCodeAt(i); }
    return u;
  }
  function ouvrir(mdp) {
    if (!window.crypto || !crypto.subtle) { return Promise.reject(new Error("navigateur")); }
    return crypto.subtle.importKey("raw", new TextEncoder().encode(mdp), "PBKDF2", false, ["deriveKey"])
      .then(function (k) {
        return crypto.subtle.deriveKey({ name: "PBKDF2", salt: octets(C.sel), iterations: C.it, hash: "SHA-256" },
                                       k, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      })
      .then(function (cle) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: octets(C.iv) }, cle, octets(C.c)); })
      .then(function (clair) {
        var html = new TextDecoder().decode(clair);
        document.open(); document.write(html); document.close();
      });
  }
  var f = document.getElementById("f"), champ = document.getElementById("mdp"), err = document.getElementById("err"), ok = document.getElementById("ok");
  function essayer(mdp, auto) {
    ok.disabled = true; err.textContent = auto ? "" : "Ouverture…";
    // Lu avant : la page déchiffrée remplace celle-ci.
    var garder = auto || document.getElementById("garder").checked;
    ouvrir(mdp).then(function () {
      try { if (garder) { localStorage.setItem(CLE, mdp); } } catch (e) {}
    }, function (e) {
      ok.disabled = false;
      err.textContent = e && e.message === "navigateur" ? "Ce navigateur est trop ancien : ouvrez le lien avec Safari ou Chrome à jour." : (auto ? "" : "Mot de passe incorrect.");
      champ.focus(); champ.select();
    });
  }
  f.addEventListener("submit", function (e) { e.preventDefault(); if (champ.value.trim()) { essayer(champ.value.trim(), false); } });
  var garde = null;
  try { garde = localStorage.getItem(CLE) || localStorage.getItem(ANCIENNE); } catch (e) {}
  if (garde) { essayer(garde, true); }
})();
</script>
</body>
</html>
